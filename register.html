<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Hostel Complaint System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-card" style="max-width: 540px;">
        <div class="auth-header">
            <div class="auth-icon">🎓</div>
            <h1>New Student Registration</h1>
            <p>Create your personal account to lodge and track complaints</p>
        </div>

        <div id="regAlert" class="alert alert-danger" style="display: none;">
            <span id="regAlertMsg">Error message</span>
            <button type="button" class="alert-close" onclick="this.parentElement.style.display='none'">&times;</button>
        </div>

        <form id="htmlRegForm">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input type="text" id="name" placeholder="e.g. Ananya Krishnan" required>
                </div>

                <div class="form-group">
                    <label for="roll_number">Roll / Reg Number <span class="required">*</span></label>
                    <input type="text" id="roll_number" placeholder="e.g. 22CS155" required>
                </div>

                <div class="form-group">
                    <label for="hostel_block">Hostel Block <span class="required">*</span></label>
                    <select id="hostel_block" required>
                        <option value="Block A (Boys)">Block A (Boys)</option>
                        <option value="Block B (Boys)">Block B (Boys)</option>
                        <option value="Block C (Girls)">Block C (Girls)</option>
                        <option value="Block D (Girls)">Block D (Girls)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="room_number">Room Number <span class="required">*</span></label>
                    <input type="text" id="room_number" placeholder="e.g. B-204" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone / Mobile No</label>
                    <input type="text" id="phone" placeholder="e.g. 9876543210">
                </div>

                <div class="form-group full-width">
                    <label for="username">Username (Login ID) <span class="required">*</span></label>
                    <input type="text" id="username" placeholder="e.g. ananya22" required>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="confirm_password" placeholder="Re-type password" required>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-primary btn-full" style="padding: 12px;">
                    Register & Enter Dashboard &rarr;
                </button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #475569;">
            Already have an account? <a href="index.html" style="color: #0284c7; font-weight: 600; text-decoration: none;">Sign In here</a>
        </div>
    </div>

    <script>
        document.getElementById('htmlRegForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const roll = document.getElementById('roll_number').value.trim();
            const block = document.getElementById('hostel_block').value;
            const room = document.getElementById('room_number').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const username = document.getElementById('username').value.trim();
            const pwd = document.getElementById('password').value;
            const cpwd = document.getElementById('confirm_password').value;

            const alertBox = document.getElementById('regAlert');
            const alertMsg = document.getElementById('regAlertMsg');

            if (pwd.length < 6) {
                alertBox.style.display = 'flex';
                alertMsg.textContent = 'Password must be at least 6 characters long.';
                return;
            }

            if (pwd !== cpwd) {
                alertBox.style.display = 'flex';
                alertMsg.textContent = 'Passwords do not match.';
                return;
            }

            // Save user to localStorage
            let users = JSON.parse(localStorage.getItem('hostel_registered_users') || '[]');
            
            // Check username uniqueness
            if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                alertBox.style.display = 'flex';
                alertMsg.textContent = `Username '${username}' is already taken. Please choose another.`;
                return;
            }

            const newUser = {
                name: name,
                roll_number: roll,
                hostel_block: block,
                room_number: room,
                phone: phone,
                username: username,
                password: pwd,
                role: 'student'
            };

            users.push(newUser);
            localStorage.setItem('hostel_registered_users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(newUser));

            alert('Registration Successful! Redirecting to your dashboard...');
            window.location.href = 'student.html';
        });
    </script>
</body>
</html>
